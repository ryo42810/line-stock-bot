name: X Replies

# Xのリプ案（自分あてのリプ＋絡む候補）をLINEへ送る（x_replies.py）。今は止めていて、手動実行のときだけ動く
# Xには何も投稿しない。LINEのカードの「返信する」から、本人が確かめて送る
on:
  workflow_dispatch: # 手動実行用ボタン（押した時点の分を、すぐ作る）
  # 2026-11-17：定時実行は止めた（X APIの費用をなくすため、PCのChromeでClaudeが返信案を作る形に切り替え）。手動実行だけ残す

permissions:
  contents: write # 記録（replies_state.json・budget/replies.json）を保存するため

concurrency:
  group: x-replies
  cancel-in-progress: false

jobs:
  run-replies:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: ./scripts/setup.sh

      - name: Run replies
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # X APIの読み取りの月の上限（空なら40ドル）。超えそうならその月は止めてLINEで知らせる
          X_BUDGET_USD: ${{ vars.X_BUDGET_USD }}
          # AIのモデルと使いすぎ防止（ai.py）。空なら Opus 5.5、今月の使用額が上限を超えたら Sonnet 5.5
          AI_MODEL: ${{ vars.AI_MODEL }}
          BUDGET_USD: ${{ vars.BUDGET_USD }}
        run: python app.py replies

      - name: Save state
        if: always()
        run: ./scripts/save_state.sh

      - name: Notify failure
        if: failure() && hashFiles('notified.flag') == ''
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
        run: ./scripts/notify_failure.sh "⚠️ Xのリプ案の配信が失敗しました。ログを確認してください。"
