name: Daily Stock Bot

on:
  workflow_dispatch: # 手動実行用ボタンを残す
  schedule:
    # 目標は日本時間(JST)の朝 06:43。
    # GitHub Actionsの定時実行は数時間遅れることが多いので、早めの時刻にも起動の予約を入れておく。
    # 早く起動できた回は 06:43 まで待ってから動き、その日すでに配信済みなら何もしないで終わる（app.py の schedule_gate）
    - cron: '43 15 * * *' # JST 00:43
    - cron: '43 17 * * *' # JST 02:43
    - cron: '43 19 * * *' # JST 04:43
    - cron: '43 21 * * *' # JST 06:43

permissions:
  contents: write # 配信履歴（history.json）を保存するため

# 同じ日の予約が重なっても、1つずつ順番に動かす（二重配信を防ぐ）
concurrency:
  group: daily-stock-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: ./scripts/setup.sh

      - name: Run script
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Xの自動投稿（Variables の X_AUTO_POST=on と、4つのキーが揃ったときだけ投稿）
          X_AUTO_POST: ${{ vars.X_AUTO_POST }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # ウォッチ銘柄の決算チェック（スプシ「気になるテーマ株_一覧表」のID。Variables で設定）
          WATCHLIST_SHEET_ID: ${{ vars.WATCHLIST_SHEET_ID }}
          # 画像の配色（空なら初期値のミッドナイト×金）
          IMAGE_THEME: ${{ vars.IMAGE_THEME }}
        run: python app.py

      # 途中で失敗しても、そこまでの記録は残す（次の予約が同じ配信をやり直さないように）
      - name: Save history
        if: always()
        run: ./scripts/save_state.sh

      - name: Notify failure
        if: failure() && hashFiles('notified.flag') == ''
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
        run: ./scripts/notify_failure.sh "⚠️ 注目株botのGitHub Actionsが失敗しました。ログを確認してください。"
