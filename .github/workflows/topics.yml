name: Note Topics

# 徹底解説（note）の記事用のトピック候補を、毎日16:00（JST）にLINEへ送る（note_topics.py）
on:
  workflow_dispatch: # 手動実行用ボタン
  schedule:
    # 目標は日本時間(JST)の 16:00（土日も）。2026/11/19に朝7:00から変更（当日のネタで書き、徹底解説を当日の勤務時間内に入稿するため）
    # 定時実行は5〜9時間遅れることが多い（2026/11の実績）ので、12時間前から1時間おきに起動の予約を入れておく。
    # 5時間前より早く起動した回は何もしないで終わり、5時間前以内に起動できた回が 16:00 まで待ってから動く。
    # その日すでに送っていれば何もしないで終わる（app.py の schedule_gate）
    - cron: '3 19-23 * * *' # JST 04:03〜08:03（1時間おき）
    - cron: '3 0-6 * * *'   # JST 09:03〜15:03（1時間おき）
    - cron: '58 6 * * *'    # JST 15:58

permissions:
  contents: write # 送った候補の記録（topics_state.json）を保存するため

concurrency:
  group: note-topics
  cancel-in-progress: false

jobs:
  run-topics:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # 定時実行は、予約した時点のコミットを取ってくる（前の回が保存した「配信済み」の記録が入っていない）。
          # 同じ日に2回配信しないように、いまの最新の main を取ってくる
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: ./scripts/setup.sh

      - name: Run topics
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          # AIのモデルと使いすぎ防止（ai.py）。空なら Opus 5.5、今月の使用額が50ドルを超えたら Sonnet 5.5
          AI_MODEL: ${{ vars.AI_MODEL }}
          BUDGET_USD: ${{ vars.BUDGET_USD }}
        run: python app.py topics

      - name: Save state
        if: always()
        run: ./scripts/save_state.sh

      - name: Notify failure
        if: failure() && hashFiles('notified.flag') == ''
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
        run: ./scripts/notify_failure.sh "⚠️ 徹底解説のネタ候補の配信が失敗しました。ログを確認してください。"
