name: Evening Review

on:
  workflow_dispatch: # 手動実行用ボタン
  schedule:
    # 目標は日本時間(JST)の 16:55（月〜金。祝日はスクリプト側でスキップ）。
    # 定時実行は5〜9時間遅れることが多い（2026/11の実績）ので、12時間前から1時間おきに起動の予約を入れておく。
    # 5時間前より早く起動した回は何もしないで終わり、5時間前以内に起動できた回が 16:55 まで待ってから動く。
    # その日すでに配信済みなら何もしないで終わる（app.py の schedule_gate）
    # Xには1本目を17:00に出し、2本目からは18:00・19:00…の予約に回す（x_queue.yml の回が出す）
    - cron: '55 19-23 * * 0-4' # JST 04:55〜08:55（月〜金。1時間おき）
    - cron: '55 0-7 * * 1-5'   # JST 09:55〜16:55（月〜金。1時間おき）

permissions:
  contents: write # X用の画像と実行の記録をリポジトリに置くため

concurrency:
  group: evening-review
  cancel-in-progress: false

jobs:
  run-review:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # 定時実行は、予約した時点のコミットを取ってくる（前の回が保存した「配信済み」の記録が入っていない）。
          # 同じ日に2回配信しないように、いまの最新の main を取ってくる
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: ./scripts/setup.sh

      - name: Run review
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          # Xの自動投稿（Variables の X_AUTO_POST=on と、4つのキーが揃ったときだけ投稿）
          X_AUTO_POST: ${{ vars.X_AUTO_POST }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          WATCHLIST_SHEET_ID: ${{ vars.WATCHLIST_SHEET_ID }}
          IMAGE_THEME: ${{ vars.IMAGE_THEME }}
          # AIのモデルと使いすぎ防止（ai.py）。空なら Opus 5.5、今月の使用額が50ドルを超えたら Sonnet 5.5
          AI_MODEL: ${{ vars.AI_MODEL }}
          BUDGET_USD: ${{ vars.BUDGET_USD }}
        run: python app.py evening

      - name: Save state
        if: always()
        run: ./scripts/save_state.sh

      - name: Notify failure
        if: failure() && hashFiles('notified.flag') == ''
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
        run: ./scripts/notify_failure.sh "⚠️ 注目株botの夕方の振り返りが失敗しました。ログを確認してください。"
